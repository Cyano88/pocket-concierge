openapi: 3.1.0
info:
  title: Pocket Concierge API
  version: 0.3.0
  description: Simple household errands backed by deterministic authority, noncustodial buyer execution, and verifiable receipts.
servers:
  - url: http://localhost:4310
security:
  - bearerAuth: []
paths:
  /v1/okx/authority-check:
    post:
      security: []
      operationId: checkPurchaseAuthority
      summary: Get a reusable deterministic spending decision after the required 0.01-USDT replay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorityCheckInput"
      responses:
        "200":
          description: APPROVE, ESCALATE, or BLOCK with a recomputable decision hash
        "402":
          description: 0.01-USDT exact EIP-3009 payment challenge on X Layer
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
  /v1/okx/authority-proof:
    get:
      operationId: getOkxAuthorityProof
      summary: Retrieve the verified governed-purchase proof after the required signed replay
      responses:
        "200":
          description: Privacy-safe authority decision, settlement evidence, and integration contract
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, integration, proof]
        "402":
          description: 0.01-USDT x402 payment challenge on X Layer; signed replay is required
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
  /v1/capabilities:
    get:
      security: []
      operationId: getCapabilities
      responses:
        "200":
          description: Verified, supported, and unavailable errand adapters
  /v1/errands:
    post:
      operationId: createErrand
      summary: Create one idempotent household errand cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrandInput"
      responses:
        "201":
          description: Errand created with an authority decision and one next action
        "200":
          description: Idempotent replay of the exact same errand cycle
        "409":
          description: externalId and cycleId already belong to a different immutable errand
  /v1/errands/{errandId}:
    get:
      operationId: getErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      responses:
        "200":
          description: Current state, decision, and one next action
        "404":
          description: Errand not found
  /v1/errands/{errandId}/authorize:
    post:
      operationId: authorizeErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifestId]
              properties:
                manifestId: { type: string }
                exception:
                  $ref: "#/components/schemas/AuthorityExceptionInput"
      responses:
        "200":
          description: Pocket Bills payment instruction after exact manifest authorization
        "409":
          description: Blocked, expired, mismatched, or missing approval
  /v1/errands/{errandId}/complete:
    post:
      operationId: completeErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusUrl, statusToken]
              properties:
                statusUrl: { type: string, format: uri }
                statusToken: { type: string, writeOnly: true }
      responses:
        "200":
          description: Verified delivery or needs-review state with privacy-safe authority receipt
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health
  /v1/contract:
    get:
      security: []
      operationId: getContract
      responses:
        "200":
          description: Supported actions and trust boundary
  /v1/authority/receipts/{receiptId}:
    get:
      security: []
      operationId: getAuthorityReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            pattern: "^pr_[a-f0-9]{32}$"
      responses:
        "200":
          description: Public privacy-safe authority and execution receipt with recomputed hash verification
        "404":
          description: Receipt not found
  /v1/missions/preview:
    post:
      operationId: previewMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "200":
          description: Deterministic mission preview; nothing is persisted or paid
  /v1/missions:
    post:
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "201":
          description: Created mission, or an idempotent replay of the same immutable manifest
        "409":
          description: externalId was already used for a different manifest
  /v1/missions/{externalId}:
    get:
      operationId: getMission
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: Mission and sanitized evidence
        "404":
          description: Mission not found
  /v1/missions/{externalId}/actions/{actionId}/approve:
    post:
      operationId: approveAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifestId]
              properties:
                manifestId:
                  type: string
                exception:
                  $ref: "#/components/schemas/AuthorityExceptionInput"
      responses:
        "200":
          description: Exact manifest approved; escalations require a one-use exception
        "409":
          description: Manifest mismatch or invalid state
  /v1/missions/{externalId}/actions/{actionId}/start:
    post:
      operationId: startAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Buyer-side OKX execution instruction; no payment is made
        "409":
          description: Action is not approved or due
  /v1/missions/{externalId}/actions/{actionId}/verify:
    post:
      operationId: verifyAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusUrl, statusToken]
              properties:
                statusUrl:
                  type: string
                  format: uri
                statusToken:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Sanitized terminal settlement evidence
        "409":
          description: Settlement is not terminal
        "502":
          description: Downstream evidence failed verification
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ErrandId:
      name: errandId
      in: path
      required: true
      schema:
        type: string
    ExternalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AuthorityCheckInput:
      type: object
      additionalProperties: false
      required: [externalId, cycleId, action, mandate]
      properties:
        externalId: { type: string }
        cycleId: { type: string }
        action:
          type: object
          additionalProperties: false
          required: [category, serviceId, privateInputRef, amountUsdt]
          properties:
            category: { type: string }
            serviceId: { type: string }
            privateInputRef:
              type: string
              description: Opaque local reference, never a customer identifier
            amountUsdt: { type: string }
        mandate:
          type: object
          additionalProperties: false
          required:
            - validFrom
            - expiresAt
            - allowedCategories
            - allowedServiceIds
            - allowedPrivateInputRefs
            - maximumPerActionUsdt
            - approvalThresholdUsdt
          properties:
            validFrom: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            allowedCategories:
              type: array
              items: { type: string }
            allowedServiceIds:
              type: array
              items: { type: string }
            allowedPrivateInputRefs:
              type: array
              items: { type: string }
            maximumPerActionUsdt: { type: string }
            approvalThresholdUsdt: { type: string }
    ErrandInput:
      type: object
      additionalProperties: false
      required: [externalId, cycleId, dueAt, errand, mandate]
      properties:
        externalId:
          type: string
          description: Stable caller or platform job identifier
        cycleId:
          type: string
          description: Stable one-off, weekly, or monthly cycle identifier
        title: { type: string }
        timezone: { type: string, default: UTC }
        dueAt: { type: string, format: date-time }
        errand:
          type: object
          additionalProperties: false
          required: [category, serviceId, variationCode, privateInputRef, maximumUsdt]
          properties:
            category:
              type: string
              enum: [data, electricity, tv]
            serviceId: { type: string }
            variationCode: { type: string }
            privateInputRef:
              type: string
              description: Opaque key into the buyer agent's local vault
            maximumUsdt: { type: string }
            description: { type: string }
        mandate:
          type: object
          additionalProperties: false
          required: [validFrom, expiresAt]
          properties:
            validFrom: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            maximumPerActionUsdt: { type: string }
            maximumCycleUsdt: { type: string }
            approvalThresholdUsdt: { type: string }
    MissionInput:
      type: object
      additionalProperties: false
      required: [externalId, title, timezone, mandate, actions]
      properties:
        externalId:
          type: string
          minLength: 8
          maxLength: 128
          description: Caller-provided idempotency identifier
        title:
          type: string
          maxLength: 160
        timezone:
          type: string
          examples: [Africa/Lagos]
        mandate:
          $ref: "#/components/schemas/Mandate"
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/OkxBillAction"
    OkxBillAction:
      type: object
      additionalProperties: false
      required: [type, reference, description, dueAt, category, serviceId, variationCode, privateInputRef, maximumUsdt]
      properties:
        type:
          const: okx_bill
        reference:
          type: string
          description: Unique action reference inside the mission
        description:
          type: string
        dueAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [data, electricity, tv]
        serviceId:
          type: string
        variationCode:
          type: string
        privateInputRef:
          type: string
          description: Opaque local reference; never a phone, meter, or smartcard number
        maximumUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
          description: Hard buyer-side payment ceiling
    Mandate:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - validFrom
        - expiresAt
        - allowedCategories
        - allowedServiceIds
        - allowedPrivateInputRefs
        - maximumPerActionUsdt
        - maximumMissionUsdt
        - approvalThresholdUsdt
        - maximumActions
      properties:
        policyVersion:
          const: "1"
        validFrom:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        allowedCategories:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum: [data, electricity, tv]
        allowedServiceIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        allowedPrivateInputRefs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Opaque local recipient references, never raw customer identifiers
        maximumPerActionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumMissionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        approvalThresholdUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumActions:
          type: integer
          minimum: 1
          maximum: 10
    AuthorityExceptionInput:
      type: object
      additionalProperties: false
      required: [decisionId, nonce, approvedMaximumUsdt, expiresAt]
      properties:
        decisionId:
          type: string
        nonce:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        approvedMaximumUsdt:
          type: string
          description: Must exactly equal the immutable action maximumUsdt
        expiresAt:
          type: string
          format: date-time
