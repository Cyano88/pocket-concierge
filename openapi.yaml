openapi: 3.1.0
info:
  title: Pocket Concierge API
  version: 0.2.0
  description: Deterministic, privacy-limited authority and mission orchestration for OKX Pocket Bills buyer agents.
servers:
  - url: http://localhost:4310
security:
  - bearerAuth: []
paths:
  /v1/okx/authority-proof:
    get:
      operationId: getOkxAuthorityProof
      summary: Retrieve the verified governed-purchase proof after the required signed replay
      responses:
        "200":
          description: Privacy-safe authority decision, settlement evidence, and integration contract
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, integration, proof]
        "402":
          description: Zero-fee x402 payment challenge on X Layer; signed replay is required
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health
  /v1/contract:
    get:
      security: []
      operationId: getContract
      responses:
        "200":
          description: Supported actions and trust boundary
  /v1/authority/receipts/{receiptId}:
    get:
      security: []
      operationId: getAuthorityReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            pattern: "^pr_[a-f0-9]{32}$"
      responses:
        "200":
          description: Public privacy-safe authority and execution receipt with recomputed hash verification
        "404":
          description: Receipt not found
  /v1/missions/preview:
    post:
      operationId: previewMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "200":
          description: Deterministic mission preview; nothing is persisted or paid
  /v1/missions:
    post:
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "201":
          description: Created mission, or an idempotent replay of the same immutable manifest
        "409":
          description: externalId was already used for a different manifest
  /v1/missions/{externalId}:
    get:
      operationId: getMission
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: Mission and sanitized evidence
        "404":
          description: Mission not found
  /v1/missions/{externalId}/actions/{actionId}/approve:
    post:
      operationId: approveAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifestId]
              properties:
                manifestId:
                  type: string
                exception:
                  $ref: "#/components/schemas/AuthorityExceptionInput"
      responses:
        "200":
          description: Exact manifest approved; escalations require a one-use exception
        "409":
          description: Manifest mismatch or invalid state
  /v1/missions/{externalId}/actions/{actionId}/start:
    post:
      operationId: startAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Buyer-side OKX execution instruction; no payment is made
        "409":
          description: Action is not approved or due
  /v1/missions/{externalId}/actions/{actionId}/verify:
    post:
      operationId: verifyAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusUrl, statusToken]
              properties:
                statusUrl:
                  type: string
                  format: uri
                statusToken:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Sanitized terminal settlement evidence
        "409":
          description: Settlement is not terminal
        "502":
          description: Downstream evidence failed verification
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ExternalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    MissionInput:
      type: object
      additionalProperties: false
      required: [externalId, title, timezone, mandate, actions]
      properties:
        externalId:
          type: string
          minLength: 8
          maxLength: 128
          description: Caller-provided idempotency identifier
        title:
          type: string
          maxLength: 160
        timezone:
          type: string
          examples: [Africa/Lagos]
        mandate:
          $ref: "#/components/schemas/Mandate"
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/OkxBillAction"
    OkxBillAction:
      type: object
      additionalProperties: false
      required: [type, reference, description, dueAt, category, serviceId, variationCode, privateInputRef, maximumUsdt]
      properties:
        type:
          const: okx_bill
        reference:
          type: string
          description: Unique action reference inside the mission
        description:
          type: string
        dueAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [data, electricity, tv]
        serviceId:
          type: string
        variationCode:
          type: string
        privateInputRef:
          type: string
          description: Opaque local reference; never a phone, meter, or smartcard number
        maximumUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
          description: Hard buyer-side payment ceiling
    Mandate:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - validFrom
        - expiresAt
        - allowedCategories
        - allowedServiceIds
        - allowedPrivateInputRefs
        - maximumPerActionUsdt
        - maximumMissionUsdt
        - approvalThresholdUsdt
        - maximumActions
      properties:
        policyVersion:
          const: "1"
        validFrom:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        allowedCategories:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum: [data, electricity, tv]
        allowedServiceIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        allowedPrivateInputRefs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Opaque local recipient references, never raw customer identifiers
        maximumPerActionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumMissionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        approvalThresholdUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumActions:
          type: integer
          minimum: 1
          maximum: 10
    AuthorityExceptionInput:
      type: object
      additionalProperties: false
      required: [decisionId, nonce, approvedMaximumUsdt, expiresAt]
      properties:
        decisionId:
          type: string
        nonce:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        approvedMaximumUsdt:
          type: string
          description: Must exactly equal the immutable action maximumUsdt
        expiresAt:
          type: string
          format: date-time
