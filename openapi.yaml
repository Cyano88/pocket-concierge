openapi: 3.1.0
info:
  title: Pocket Concierge API
  version: 0.5.0
  description: Governed household errands, launch-scheduled Ethereum NFT mint delivery, and rights-aware wallpaper commerce.
servers:
  - url: http://localhost:4310
security:
  - bearerAuth: []
paths:
  /v1/okx/authority-check:
    post:
      security: []
      operationId: checkPurchaseAuthority
      summary: Get a reusable deterministic spending decision after the required 0.01-USDT replay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorityCheckInput"
      responses:
        "200":
          description: APPROVE, ESCALATE, or BLOCK with a self-contained, independently recomputable proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorityCheckOutput"
        "402":
          description: 0.01-USDT exact EIP-3009 payment challenge on X Layer
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
  /v1/okx/authority-proof:
    get:
      operationId: getOkxAuthorityProof
      summary: Retrieve the verified governed-purchase proof after the required signed replay
      responses:
        "200":
          description: Privacy-safe authority decision, settlement evidence, and integration contract
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, integration, proof]
        "402":
          description: 0.01-USDT x402 payment challenge on X Layer; signed replay is required
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
  /v1/capabilities:
    get:
      security: []
      operationId: getCapabilities
      responses:
        "200":
          description: Verified, supported, and unavailable errand adapters
  /v1/public/nft-pilot:
    get:
      security: []
      operationId: getVerifiedNftPilotProof
      summary: Read the privacy-safe proof of Pocket's completed Ethereum mint, delivery, and refund pilot
      description: |
        Returns only public-chain evidence and immutable spending limits. Wallet credentials,
        order capability tokens, operator keys, and private customer references are excluded.
      responses:
        "200":
          description: Recomputable proof with X Layer payment, Ethereum funding, mint, delivery, refund, and explorer links
        "503":
          description: No fully verified public pilot has been configured
  /v1/nft-mints/preview:
    post:
      security: []
      operationId: previewNftMintOrder
      summary: Verify a supported SeaDrop public mint and estimate its bounded execution cost for free
      description: |
        Reads the live Ethereum public-drop configuration, validates the official
        SeaDrop call, checks the customer's price and total-cost limits, and returns
        an immutable manifest hash. It creates no order, accepts no ETH, and charges
        no service fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NftMintOrderInput"
      responses:
        "200":
          description: Supported live public mint, current price, bounded gas estimate, and next action
        "409":
          description: Public stage, wallet limit, supply, price, or total-cost mandate is not currently executable
        "422":
          description: Collection is not a supported official SeaDrop 1.0 public mint
        "503":
          description: Ethereum NFT adapter is not configured
  /v1/okx/nft-mints/orders:
    post:
      operationId: createPaidNftMintOrder
      summary: Pay 1 USDT to create one bounded, customer-funded Ethereum mint-and-deliver order
      description: |
        The 1-USDT X Layer payment is Pocket's service fee. It is separate from the
        native ETH execution capital. The paid replay returns the immutable order,
        a secret order access token, the Ethereum treasury address, and the exact
        maximum ETH deposit required before the order can become armed. Unpaid public
        requests receive the x402 challenge directly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NftMintOrderInput"
      responses:
        "201":
          description: Accepted execution-order deliverable, deposit instructions, final-proof URL, and order access token
        "200":
          description: Idempotent replay of the identical accepted execution-order deliverable
        "402":
          description: 1-USDT exact EIP-3009 payment challenge on X Layer
          headers:
            PAYMENT-REQUIRED:
              required: true
              schema: { type: string }
        "409":
          description: externalId already belongs to a different immutable order
        "429":
          description: Public order validation rate limit exceeded
  /v1/nft-mints/orders/{externalId}:
    get:
      operationId: getNftMintOrder
      security:
        - orderToken: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: Current order state and verified transaction evidence
        "401":
          description: Missing or invalid order access token
  /v1/nft-mints/signer-config:
    get:
      operationId: verifyNftSignerConfiguration
      summary: Authenticated read-only check that the API and isolated signer use the same treasury
      parameters:
        - in: header
          name: X-Operator-Key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chain, treasury, access mode, and supported signer actions
        "401":
          description: Invalid execution-operator credential
  /v1/nft-mints/orders/{externalId}/funding:
    post:
      operationId: confirmNftMintFunding
      security:
        - orderToken: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [depositTransactionHash]
              properties:
                depositTransactionHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Deposit verified and order armed
        "409":
          description: Deposit mismatched, insufficient, confirming, failed, expired, or already claimed
  /v1/nft-mints/orders/{externalId}/cancel:
    post:
      operationId: cancelNftMintOrder
      security:
        - orderToken: []
      summary: Cancel an unfunded order or request an exact pre-mint refund
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [customer_cancelled, mint_failed, order_expired]
      responses:
        "200":
          description: Unfunded order cancelled or funded order moved to cancelling
        "409":
          description: Reserved mint nonce still requires a verified success or failure outcome
  /v1/nft-mints/orders/{externalId}/prepare:
    post:
      operationId: prepareNftMintExecution
      summary: Internal signer-worker endpoint; revalidate and prepare the bounded SeaDrop transaction
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Atomically claimed mint lease with calldata, cost ceilings, and reserved Ethereum nonce
        "409":
          description: Order is unfunded, treasury lease is busy, nonce is reserved, or cost exceeds the mandate
  /v1/nft-mints/orders/{externalId}/recover-unbroadcast-mint:
    post:
      operationId: recoverExpiredUnbroadcastNftMint
      summary: Internal signer-worker recovery for an expired plan that never reached the signer ledger
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Expired lease released and funded order returned to armed
        "409":
          description: Recovery is too early, belongs to another worker, or the Ethereum nonce advanced
  /v1/nft-mints/orders/{externalId}/minted:
    post:
      operationId: recordNftMint
      summary: Internal signer-worker endpoint; verify the mined token from its transaction hash
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionHashInput"
      responses:
        "200":
          description: Mint verified; exact token ID recorded for delivery
  /v1/nft-mints/orders/{externalId}/failed:
    post:
      operationId: recordFailedNftMint
      summary: Verify a reverted mint against the leased calldata, value, sender, and nonce
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mintTransactionHash]
              properties:
                mintTransactionHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Failed mint gas verified; order is eligible for a cancellation refund
        "409":
          description: Transaction is unconfirmed or does not match the reserved mint plan and nonce
  /v1/nft-mints/orders/{externalId}/delivery-plan:
    post:
      operationId: prepareNftDelivery
      summary: Internal signer-worker endpoint; prepare the exact NFT transfer
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Short-lived transfer plan bound to the minted token and declared recipient
  /v1/nft-mints/orders/{externalId}/delivered:
    post:
      operationId: recordNftDelivery
      summary: Internal signer-worker endpoint; verify transfer of the minted token to the declared recipient
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deliveryTransactionHash]
              properties:
                deliveryTransactionHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Delivery verified with transaction hash, token ID, recipient, and gas evidence
  /v1/nft-mints/orders/{externalId}/refund:
    post:
      operationId: prepareNftMintRefund
      summary: Internal signer-worker endpoint; calculate and prepare the unused-ETH refund
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Exact refund plan after verified mint and delivery costs
  /v1/nft-mints/orders/{externalId}/refunded:
    post:
      operationId: recordNftMintRefund
      summary: Internal signer-worker endpoint; verify the exact refund transfer
      security:
        - operatorKey: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refundTransactionHash]
              properties:
                refundTransactionHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Refund verified; order finalized with complete purchase, delivery, and refund evidence
  /v1/nft-mints/orders/{externalId}/wallpaper:
    post:
      operationId: createPrivateNftWallpaper
      summary: Turn one verified delivered NFT into a private desktop and mobile wallpaper pack
      security:
        - orderToken: []
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "201":
          description: Deterministic private-use wallpaper pack with scoped download links and hashes
        "200":
          description: Idempotent replay of an existing wallpaper pack
        "409":
          description: NFT delivery is not verified or token metadata is not revealed yet
  /v1/wallpapers:
    get:
      security: []
      operationId: listPublicNftWallpapers
      summary: Browse rights-reviewed NFT wallpaper previews for free
      responses:
        "200":
          description: Public catalog with NFT provenance and reviewed rights references
  /v1/wallpapers/{assetId}:
    get:
      security: []
      operationId: getPublicNftWallpaper
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, pattern: "^nwa_[a-f0-9]{24}$" }
      responses:
        "200":
          description: Public preview, provenance, and rights classification
        "404":
          description: Asset is not in the reviewed public catalog
  /v1/wallpapers/{assetId}/download/{variant}:
    get:
      security: []
      operationId: downloadNftWallpaper
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, pattern: "^nwa_[a-f0-9]{24}$" }
        - in: path
          name: variant
          required: true
          schema: { type: string, enum: [preview, desktop, mobile] }
        - in: query
          name: token
          schema: { type: string }
      responses:
        "200":
          description: Public preview or paid full-resolution PNG
        "401":
          description: Full-resolution download token is missing, invalid, or expired
  /v1/okx/wallpapers/purchase:
    post:
      security: []
      operationId: purchaseNftWallpaper
      summary: Pay 0.01 USDT for one full-resolution rights-reviewed wallpaper bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetId]
              properties:
                assetId:
                  type: string
                  pattern: "^nwa_[a-f0-9]{24}$"
      responses:
        "200":
          description: Desktop/mobile downloads, file hashes, NFT provenance, and license receipt
        "402":
          description: 0.01-USDT exact EIP-3009 payment challenge on X Layer
  /v1/wallpapers/catalog/from-order:
    post:
      operationId: reviewNftWallpaperForCatalog
      summary: Internal operator review that promotes a private pack only with explicit commercial rights evidence
      security:
        - operatorKey: []
      responses:
        "201":
          description: Wallpaper admitted to the public catalog
  /v1/errands:
    post:
      operationId: createErrand
      summary: Create one idempotent household errand cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrandInput"
      responses:
        "201":
          description: Errand created with an authority decision and one next action
        "200":
          description: Idempotent replay of the exact same errand cycle
        "409":
          description: externalId and cycleId already belong to a different immutable errand
  /v1/errands/{errandId}:
    get:
      operationId: getErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      responses:
        "200":
          description: Current state, decision, and one next action
        "404":
          description: Errand not found
  /v1/errands/{errandId}/authorize:
    post:
      operationId: authorizeErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifestId]
              properties:
                manifestId: { type: string }
                exception:
                  $ref: "#/components/schemas/AuthorityExceptionInput"
      responses:
        "200":
          description: Pocket Bills payment instruction after exact manifest authorization
        "409":
          description: Blocked, expired, mismatched, or missing approval
  /v1/errands/{errandId}/complete:
    post:
      operationId: completeErrand
      parameters:
        - $ref: "#/components/parameters/ErrandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusUrl, statusToken]
              properties:
                statusUrl: { type: string, format: uri }
                statusToken: { type: string, writeOnly: true }
      responses:
        "200":
          description: Verified delivery or needs-review state with privacy-safe authority receipt
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health
  /v1/contract:
    get:
      security: []
      operationId: getContract
      responses:
        "200":
          description: Supported actions and trust boundary
  /v1/authority/receipts/{receiptId}:
    get:
      security: []
      operationId: getAuthorityReceipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            pattern: "^pr_[a-f0-9]{32}$"
      responses:
        "200":
          description: Public privacy-safe authority and execution receipt with recomputed hash verification
        "404":
          description: Receipt not found
  /v1/missions/preview:
    post:
      operationId: previewMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "200":
          description: Deterministic mission preview; nothing is persisted or paid
  /v1/missions:
    post:
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionInput"
      responses:
        "201":
          description: Created mission, or an idempotent replay of the same immutable manifest
        "409":
          description: externalId was already used for a different manifest
  /v1/missions/{externalId}:
    get:
      operationId: getMission
      parameters:
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: Mission and sanitized evidence
        "404":
          description: Mission not found
  /v1/missions/{externalId}/actions/{actionId}/approve:
    post:
      operationId: approveAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifestId]
              properties:
                manifestId:
                  type: string
                exception:
                  $ref: "#/components/schemas/AuthorityExceptionInput"
      responses:
        "200":
          description: Exact manifest approved; escalations require a one-use exception
        "409":
          description: Manifest mismatch or invalid state
  /v1/missions/{externalId}/actions/{actionId}/start:
    post:
      operationId: startAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Buyer-side OKX execution instruction; no payment is made
        "409":
          description: Action is not approved or due
  /v1/missions/{externalId}/actions/{actionId}/verify:
    post:
      operationId: verifyAction
      parameters:
        - $ref: "#/components/parameters/ExternalId"
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statusUrl, statusToken]
              properties:
                statusUrl:
                  type: string
                  format: uri
                statusToken:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Sanitized terminal settlement evidence
        "409":
          description: Settlement is not terminal
        "502":
          description: Downstream evidence failed verification
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    orderToken:
      type: apiKey
      in: header
      name: X-Order-Token
    operatorKey:
      type: apiKey
      in: header
      name: X-Operator-Key
  parameters:
    ExternalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    WorkerId:
      name: X-Worker-Id
      in: header
      required: true
      description: Stable identifier for the isolated signer worker claiming the one-use transaction lease.
      schema:
        type: string
        minLength: 3
        maxLength: 80
    ErrandId:
      name: errandId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    NftMintOrderInput:
      type: object
      additionalProperties: false
      required:
        - externalId
        - collectionSlug
        - nftContract
        - nftRecipient
        - refundAddress
        - fundingAddress
        - quantity
        - maxMintPriceWei
        - maxTotalCostWei
        - expiresAt
      properties:
        externalId:
          type: string
          minLength: 8
          maxLength: 128
          description: Caller-provided idempotency identifier
        collectionSlug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,99}$"
        nftContract:
          type: string
          description: Expected Ethereum ERC-721 collection address
        nftRecipient:
          type: string
          description: Ethereum address that must receive the minted NFT
        refundAddress:
          type: string
          description: Ethereum address that receives unused or refunded execution capital
        fundingAddress:
          type: string
          description: Ethereum address that must send the execution-capital deposit
        quantity:
          type: integer
          const: 1
        maxMintPriceWei:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
        maxTotalCostWei:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Full ETH cap covering mint, delivery, refund gas, and safety reserve
        expiresAt:
          type: string
          format: date-time
        executionMode:
          type: string
          enum: [immediate, scheduled]
          default: immediate
        executionWindowSeconds:
          type: integer
          minimum: 30
          maximum: 1800
          description: Scheduled public-stage execution window after the onchain stage start
        maxFeePerGasWei:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Required EIP-1559 total fee ceiling for scheduled execution
        maxPriorityFeePerGasWei:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Required EIP-1559 priority-fee ceiling for scheduled execution
        maxReplacementAttempts:
          type: integer
          const: 0
          description: Replacement transactions are disabled until same-nonce recovery is independently proven
    TransactionHashInput:
      type: object
      additionalProperties: false
      required: [mintTransactionHash]
      properties:
        mintTransactionHash:
          type: string
          pattern: "^0x[0-9a-fA-F]{64}$"
    AuthorityCheckInput:
      type: object
      additionalProperties: false
      required: [externalId, cycleId, action, mandate]
      properties:
        externalId: { type: string }
        cycleId: { type: string }
        action:
          type: object
          additionalProperties: false
          required: [category, serviceId, privateInputRef, amountUsdt]
          properties:
            category: { type: string }
            serviceId: { type: string }
            privateInputRef:
              type: string
              description: Opaque local reference, never a customer identifier
            amountUsdt: { type: string }
        mandate:
          type: object
          additionalProperties: false
          required:
            - validFrom
            - expiresAt
            - allowedCategories
            - allowedServiceIds
            - allowedPrivateInputRefs
            - maximumPerActionUsdt
            - approvalThresholdUsdt
          properties:
            validFrom: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            allowedCategories:
              type: array
              items: { type: string }
            allowedServiceIds:
              type: array
              items: { type: string }
            allowedPrivateInputRefs:
              type: array
              items: { type: string }
            maximumPerActionUsdt: { type: string }
            approvalThresholdUsdt: { type: string }
    AuthorityCheckOutput:
      type: object
      required:
        - ok
        - service
        - request
        - decision
        - reasons
        - decisionId
        - decisionHash
        - evaluatedAt
        - nextAction
        - deliverable
        - verification
        - privacy
      properties:
        ok: { type: boolean, const: true }
        service: { type: string }
        exampleUsed: { type: boolean }
        request: { type: object }
        decision:
          type: string
          enum: [APPROVE, ESCALATE, BLOCK]
        reasons:
          type: array
          items: { type: string }
        decisionId: { type: string }
        decisionHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evaluatedAt: { type: string, format: date-time }
        nextAction:
          oneOf:
            - type: object
            - type: "null"
        deliverable:
          type: object
          required: [type, status, decision, reasons, nextAction, inputManifestHash, decisionHash]
          properties:
            type: { type: string, const: governed_purchase_decision }
            status: { type: string, const: verified }
            decision: { type: string, enum: [APPROVE, ESCALATE, BLOCK] }
            reasons: { type: array, items: { type: string } }
            nextAction:
              oneOf:
                - type: object
                - type: "null"
            inputManifestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            decisionHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        verification:
          type: object
          required: [valid, algorithm, canonicalization, canonicalPayload, expectedHash, recomputedHash]
          properties:
            valid: { type: boolean, const: true }
            algorithm: { type: string, const: SHA-256 }
            canonicalization: { type: string }
            canonicalPayload: { type: object }
            expectedHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            recomputedHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        privacy: { type: string }
    ErrandInput:
      type: object
      additionalProperties: false
      required: [externalId, cycleId, dueAt, errand, mandate]
      properties:
        externalId:
          type: string
          description: Stable caller or platform job identifier
        cycleId:
          type: string
          description: Stable one-off, weekly, or monthly cycle identifier
        title: { type: string }
        timezone: { type: string, default: UTC }
        dueAt: { type: string, format: date-time }
        errand:
          type: object
          additionalProperties: false
          required: [category, serviceId, variationCode, privateInputRef, maximumUsdt]
          properties:
            category:
              type: string
              enum: [data, electricity, tv]
            serviceId: { type: string }
            variationCode: { type: string }
            privateInputRef:
              type: string
              description: Opaque key into the buyer agent's local vault
            maximumUsdt: { type: string }
            description: { type: string }
        mandate:
          type: object
          additionalProperties: false
          required: [validFrom, expiresAt]
          properties:
            validFrom: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            maximumPerActionUsdt: { type: string }
            maximumCycleUsdt: { type: string }
            approvalThresholdUsdt: { type: string }
    MissionInput:
      type: object
      additionalProperties: false
      required: [externalId, title, timezone, mandate, actions]
      properties:
        externalId:
          type: string
          minLength: 8
          maxLength: 128
          description: Caller-provided idempotency identifier
        title:
          type: string
          maxLength: 160
        timezone:
          type: string
          examples: [Africa/Lagos]
        mandate:
          $ref: "#/components/schemas/Mandate"
        actions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/OkxBillAction"
    OkxBillAction:
      type: object
      additionalProperties: false
      required: [type, reference, description, dueAt, category, serviceId, variationCode, privateInputRef, maximumUsdt]
      properties:
        type:
          const: okx_bill
        reference:
          type: string
          description: Unique action reference inside the mission
        description:
          type: string
        dueAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [data, electricity, tv]
        serviceId:
          type: string
        variationCode:
          type: string
        privateInputRef:
          type: string
          description: Opaque local reference; never a phone, meter, or smartcard number
        maximumUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
          description: Hard buyer-side payment ceiling
    Mandate:
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - validFrom
        - expiresAt
        - allowedCategories
        - allowedServiceIds
        - allowedPrivateInputRefs
        - maximumPerActionUsdt
        - maximumMissionUsdt
        - approvalThresholdUsdt
        - maximumActions
      properties:
        policyVersion:
          const: "1"
        validFrom:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        allowedCategories:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum: [data, electricity, tv]
        allowedServiceIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
        allowedPrivateInputRefs:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
          description: Opaque local recipient references, never raw customer identifiers
        maximumPerActionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumMissionUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        approvalThresholdUsdt:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,6})?$"
        maximumActions:
          type: integer
          minimum: 1
          maximum: 10
    AuthorityExceptionInput:
      type: object
      additionalProperties: false
      required: [decisionId, nonce, approvedMaximumUsdt, expiresAt]
      properties:
        decisionId:
          type: string
        nonce:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        approvedMaximumUsdt:
          type: string
          description: Must exactly equal the immutable action maximumUsdt
        expiresAt:
          type: string
          format: date-time
